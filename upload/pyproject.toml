[project]
name = "upload"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "tuspyserver",
    "aiofiles",
    "requests",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-mypy",
    "ruff",
    "types-aiofiles",
    "types-dateparser",
    "types-requests",
]

[project.scripts]
backend = "backend.upload:main"

[tool.pytest]
asyncio_mode = "auto"
addopts = ["--doctest-modules", "-p", "no:cacheprovider"]  # --mypy # mypy slows my flow down
filterwarnings = [
]

[tool.ruff]
line-length = 120

[tool.pyright]
reportUnusedCallResult = false
reportUninitializedInstanceVariable = false
reportUnreachable = false
reportUnannotatedClassAttribute = false
reportUnusedParameter = false
